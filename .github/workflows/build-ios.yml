name: Build ALIS iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          uname -m

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Build unsigned arm64 app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ALISNative.xcodeproj \
            -scheme ALISNative \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee xcodebuild.log

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/ALISNative.app"
          test -d "$APP"
          rm -rf Payload ALIS-iOS.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ALIS-iOS.ipa Payload
          ls -lh ALIS-iOS.ipa
          shasum -a 256 ALIS-iOS.ipa | tee ALIS-iOS.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALIS-iOS-IPA
          path: ALIS-iOS.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: warn

      - name: Publish unsigned IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build
          name: ALIS iOS native forced-port build
          body: |
            Unsigned arm64 IPA, iOS 17+.

            This is a native SceneKit reconstruction of the ALIS Kazan flight showcase,
            not the UE5.8 original. Install with Sideloadly using a free Apple ID (7 days).
          files: |
            ALIS-iOS.ipa
            ALIS-iOS.sha256
          make_latest: true
          overwrite_files: true
