name: ALISNative
options:
  bundleIdPrefix: com.alis
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CLANG_ENABLE_MODULES: YES

targets:
  ALISNative:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alis.worldreborn.native
        INFOPLIST_FILE: Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        ENABLE_BITCODE: NO

schemes:
  ALISNative:
    build:
      targets:
        ALISNative: all
    run:
      config: Debug
    archive:
      config: Release
